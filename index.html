<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaeneko</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-bg"></div>

<header class="shop-header">
    <h1 class="logo">Yaeneko</h1>
    
    <a href="shop.html" class="explore-btn">
        Explore all creations
    </a>

    <div class="header-actions">
        <a href="https://www.instagram.com/yaeneko.bd?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="cart-btn" 
           aria-label="Visit Instagram">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" 
                 stroke="currentColor" stroke-width="2" 
                 stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
        </a>

        <a href="cart.html" class="cart-btn" aria-label="View Cart">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                 <circle cx="9" cy="21" r="1"></circle>
                 <circle cx="20" cy="21" r="1"></circle>
                 <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span class="cart-count" id="cartCount">0</span>
        </a>
    </div>
</header>


<div class="hero-section">

    </div>

<div class="wheel-container" id="wheelContainer">
    <div class="wheel" id="spinningWheel">
        <div class="wheel-head-pos head-1">
            <div class="wheel-content">
                <div class="wheel-head"><img src="logo1.jpg" alt="Plushies"></div>
                <span class="wheel-label">Plushies</span>

        </div>
        <div class="wheel-head-pos head-2">

        </div>
        <div class="wheel-head-pos head-3">
            <div class="wheel-content">
                <div class="wheel-head"><img src="logo3.png" alt="Hair Accessories"></div>
                <span class="wheel-label">Hair Accessories</span>
            </div>
        </div>
        <div class="wheel-head-pos head-4">
            <div class="wheel-content">
                <div class="wheel-head"><img src="logo4.png" alt="Figurines"></div>
                <span class="wheel-label">Figurines</span>
            </div>
        </div>
        <div class="wheel-head-pos head-5">
            <div class="wheel-content">
                <div class="wheel-head"><img src="logo5.png" alt="Bouquet/Flowers"></div>
                <span class="wheel-label">Bouquet/Flowers</span>
            </div>
        </div>
        <div class="wheel-head-pos head-6">
            <div class="wheel-content">
                <div class="wheel-head"><img src="logo6.png" alt="Sanrio"></div>
                <span class="wheel-label">Sanrio</span>
            </div>
        </div>
        <div class="wheel-head-pos head-7">
            <div class="wheel-content">
                <div class="wheel-head"><img src="logo7.png" alt="Clips"></div>
                <span class="wheel-label">Clips</span>
            </div>
        </div>
        <div class="wheel-head-pos head-8">
            <div class="wheel-content">
                <div class="wheel-head"><img src="logo8.png" alt="Cat collars"></div>
                <span class="wheel-label">Cat collars</span>
            </div>
        </div>
    </div>
</div>


         <h2 class="section-title">Fresh Off the Hook</h2>
		 
		 <div class="stack-container" id="stackContainer">
    <div class="stack-card slot-far-left"><img src="logo1.png" alt="Product 1"></div>
    <div class="stack-card slot-mid-left"><img src="logo2.png" alt="Product 2"></div>
    <div class="stack-card slot-center"><img src="Spiderman.png" alt="Product 3"></div>
    <div class="stack-card slot-mid-right"><img src="logo4.png" alt="Product 4"></div>
    <div class="stack-card slot-far-right"><img src="logo5.png" alt="Product 5"></div>
         </div>
		  
		  
     <script src="script.js"></script>
	 
	 <div id="imageModal" class="image-modal">
    <span class="modal-close">&times;</span>

     </div>
